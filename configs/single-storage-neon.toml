# Single-agent control for storage: one agent alone, no board, the main task otherwise unchanged; neon models.
environment = "storage"
agents = 1
tokens_per_agent = 250000
efforts = ["medium"]
seeds = 20
workers = 30

[[models]]
model = "google/gemini-4-neon"
provider = "google-ai-studio"

[[variants]]
name = "single-storage"
no_board = true
