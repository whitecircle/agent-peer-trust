# Swarm history on GPT-6.2 Sol and Astra: the same six cells as history-anthropic-cc (the Opus history boards), through
# OpenRouter. Opus 5.5 (Claude Code): 2/40, 28/40, 32/40, 2/40, 35/40, 35/40. not_allowed, 20 episodes each.
