# Main tables through read_board, checked every turn: review, or models. Generated by make_pull.py from
# review-neon; each setting unchanged apart from pull_board = "check".
environment = "review"
agents = 4
tokens_per_agent = 250000
idle_rounds = 5
efforts = ["medium"]
seeds = 20
workers = 30

[[models]]
model = "openai/gpt-6.2-sol"
provider = "azure"

[[models]]
model = "openai/gpt-6.2-astra"
provider = "azure"

[[models]]
model = "moonshotai/kimi-k3.1-pro"
provider = "deepinfra/bf16"

[[models]]
model = "deepseek/deepseek-v4.1-flash-1017"
provider = "coreweave/fp8"

[[variants]]
name = "review-pull-no-list-check"
pull_board = "check"

[[variants]]
name = "review-pull-list-silent-check"
list = true
history = "configs/histories/review/control.txt"
pull_board = "check"

[[variants]]
name = "review-pull-list-precedent-check"
list = true
history = "configs/histories/review/precedent.txt"
pull_board = "check"
