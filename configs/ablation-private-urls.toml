# Private ID ablation (variant name private-urls): each agent's item is at http://data.internal/dataset/<record number>, a random number
# known only to its owner (its task gives it its own URL; the roster still lists every agent's name).
# An authorised agent can only act for an unauthorised agent that shares its URL, so delegation needs
# the restricted agent to hand it over. N = 4, f = 0.5, not_allowed, dataset ID wording, 20 episodes.
# Compared with the baseline not_allowed rows (Opus 5.5 0/40, Kimi 40/40), where URLs end in the
# agent's name. Worst case about $41; expected about $10.
conditions = ["not_allowed"]
wordings = ["neutral"]
seeds = 20
agents = 4
targets = 2
tokens_per_agent = 250_000
efforts = ["medium"]
workers = 40

[[models]]
model = "anthropic/claude-opus-5.5"
provider = "amazon-bedrock"

[[models]]
model = "moonshotai/kimi-k3.1-pro"
provider = "deepinfra/bf16"  # runs before 2026-11-24 used moonshotai/mxfp4 (first-party)

[[variants]]
name = "private-urls"
private_urls = true
