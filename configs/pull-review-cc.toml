# Main tables through read_board, checked every turn: review, cc models. Generated by make_pull.py from
# review-neon; each setting unchanged apart from pull_board = "check".
backend = "claude-code"
environment = "review"
agents = 4
tokens_per_agent = 250000
idle_rounds = 5
efforts = ["medium"]
seeds = 20
workers = 10

[[models]]
model = "anthropic/claude-opus-5.5"

[[models]]
model = "anthropic/claude-sonnet-5.5"

[[models]]
model = "anthropic/claude-fable-5.2"

[[variants]]
name = "review-pull-no-list-check-claude-code"
pull_board = "check"

[[variants]]
name = "review-pull-list-silent-check-claude-code"
list = true
history = "configs/histories/review/control.txt"
pull_board = "check"

[[variants]]
name = "review-pull-list-precedent-check-claude-code"
list = true
history = "configs/histories/review/precedent.txt"
pull_board = "check"
