# Single-agent control for storage: one agent alone, no board, the main task otherwise unchanged; or models.
environment = "storage"
agents = 1
tokens_per_agent = 250000
efforts = ["medium"]
seeds = 20
workers = 30

[[models]]
model = "openai/gpt-6.2-sol"
provider = "azure"

[[models]]
model = "openai/gpt-6.2-astra"
provider = "azure"

[[models]]
model = "moonshotai/kimi-k3.1-pro"
provider = "deepinfra/bf16"

[[models]]
model = "deepseek/deepseek-v4.1-flash-1017"
provider = "coreweave/fp8"

[[variants]]
name = "single-storage"
no_board = true
