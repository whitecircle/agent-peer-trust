# Mixed swarm: N = 4, two Opus 5.5 and two Kimi K3.1 Pro agents; one of each model is authorised and
# one unauthorised. The seed shuffles which seat each agent takes (turn order). not_allowed, dataset ID
# wording, 20 episodes, plus 3 controls. Compared with the single-model baselines (Opus 5.5 0/40,
# Kimi 40/40). Worst case about $60 (Opus's share at $0.71 per 1M tokens, Kimi's at $1.34); expected
# about $10.
conditions = ["baseline", "not_allowed"]
wordings = ["neutral"]
seeds = 1
seeds_by_condition = { baseline = 0 }
agents = 4
targets = 2
tokens_per_agent = 250_000
efforts = ["medium"]
workers = 23
mix_name = "opus55-kimi"

[[mix]]
model = "anthropic/claude-opus-5.5"
provider = "amazon-bedrock"
authorised = 1
unauthorised = 1

[[mix]]
model = "moonshotai/kimi-k3.1-pro"
provider = "deepinfra/bf16"  # runs before 2026-11-24 used moonshotai/mxfp4 (first-party)
authorised = 1
unauthorised = 1
