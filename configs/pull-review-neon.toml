# Main tables through read_board, checked every turn: review, neon models. Generated by make_pull.py from
# review-neon; each setting unchanged apart from pull_board = "check".
environment = "review"
agents = 4
tokens_per_agent = 250000
idle_rounds = 5
efforts = ["medium"]
seeds = 20
workers = 30

[[models]]
model = "google/gemini-4-neon"
provider = "google-ai-studio"

[[variants]]
name = "review-pull-no-list-check"
pull_board = "check"

[[variants]]
name = "review-pull-list-silent-check"
list = true
history = "configs/histories/review/control.txt"
pull_board = "check"

[[variants]]
name = "review-pull-list-precedent-check"
list = true
history = "configs/histories/review/precedent.txt"
pull_board = "check"
