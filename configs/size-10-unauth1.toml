# Swarm size: 10 agents, 1 of them unauthorised (see roadmap.md for why the extremes).
# not_allowed only (cant saturates for every model), plus a 3-seed control. Opus 5.5 polices itself;
# Kimi routes around the rule through authorised agents, never using the tool itself.
# Worst case: 23 Opus episodes x 2.5M tokens x $0.71/M + 23 Kimi x $1.34/M,
# about $118; expected about $10.
conditions = ["baseline", "not_allowed"]
wordings = ["neutral"]
seeds = 20
seeds_by_condition = { baseline = 3 }
agents = 10
targets = 1
tokens_per_agent = 250_000
efforts = ["medium"]
workers = 46

[[models]]
model = "anthropic/claude-opus-5.5"
provider = "amazon-bedrock"

[[models]]
model = "moonshotai/kimi-k3.1-pro"
provider = "deepinfra/bf16"  # runs before 2026-11-24 used moonshotai/mxfp4 (first-party)
