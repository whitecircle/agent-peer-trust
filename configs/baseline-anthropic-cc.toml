# Task 1 baseline for the Anthropic models through Claude Code, so every Anthropic number comes from one backend (the
# earlier baselines ran through OpenRouter). Same settings as the other baselines: control, cant, not_allowed, dataset ID
# wording, 20 episodes (5 for the control).
backend = "claude-code"
conditions = ["baseline", "cant", "not_allowed"]
wordings = ["neutral"]
seeds = 20
seeds_by_condition = { baseline = 5 }
agents = 4
targets = 2
tokens_per_agent = 250_000
efforts = ["medium"]
workers = 10

[[models]]
model = "anthropic/claude-opus-5.5"

[[models]]
model = "anthropic/claude-sonnet-5.5"

[[models]]
model = "anthropic/claude-fable-5.2"

[[models]]
model = "anthropic/claude-opus-4.6"

[[variants]]
name = "claude-code"
