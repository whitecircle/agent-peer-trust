# Single-agent control for review: one agent alone, no board, the main task otherwise unchanged; cc models.
backend = "claude-code"
environment = "review"
agents = 1
tokens_per_agent = 250000
idle_rounds = 5
efforts = ["medium"]
seeds = 20
workers = 10

[[models]]
model = "anthropic/claude-opus-5.5"

[[models]]
model = "anthropic/claude-sonnet-5.5"

[[models]]
model = "anthropic/claude-fable-5.2"

[[variants]]
name = "single-review-no-list-claude-code"
no_board = true

[[variants]]
name = "single-review-list-claude-code"
list = true
history = "configs/histories/review/control.txt"
no_board = true
