# Swarm history with the board read through read_board. Every earlier history run (late joiners, written
# histories, transfer) pushed the board into the user turn, undelimited. Through Claude Code there: late joiners
# k=3 28/40, the real k=3 board as fixed written history 32/40 (transfer-7-cc). Same two boards, read through
# read_board as a tool result. Opus 5.5 through Claude Code, not_allowed, 20 episodes each.
backend = "claude-code"
conditions = ["not_allowed"]
wordings = ["neutral"]
agents = 4
targets = 2
tokens_per_agent = 250_000
efforts = ["medium"]
seeds = 20
workers = 10

[[models]]
model = "anthropic/claude-opus-5.5"

