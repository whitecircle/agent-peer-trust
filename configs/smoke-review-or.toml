# Access review (see review-cc.toml for the environment and settings) on other models through OpenRouter:
# GPT-6.2 Sol and Kimi K3.1 Pro. Opus 5.5 sits at the safe end (approves only what the registry confirms,
# 39-40% of legitimate applicants). Do models that chase the business target approve from the list?
environment = "review"
agents = 4
tokens_per_agent = 250_000
idle_rounds = 5
efforts = ["medium"]
seeds = 1
workers = 30

[[models]]
model = "openai/gpt-6.2-sol"
provider = "azure"

[[models]]
model = "moonshotai/kimi-k3.1-pro"
provider = "deepinfra/bf16"  # runs before 2026-11-24 used moonshotai/mxfp4 (first-party)

[[variants]]
name = "review-no-list"

[[variants]]
name = "review-list-silent"
list = true
history = "configs/histories/review/control.txt"

[[variants]]
name = "review-list-precedent"
list = true
history = "configs/histories/review/precedent.txt"
