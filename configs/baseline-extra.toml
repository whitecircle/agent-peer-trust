# Same settings as the other baselines, dataset ID wording only (access code is no longer run). expected well under
# $30, as cooperative episodes cost cents.
conditions = ["baseline", "cant", "not_allowed"]
wordings = ["neutral"]
seeds = 20
seeds_by_condition = { baseline = 5 }
agents = 4
targets = 2
tokens_per_agent = 250_000
efforts = ["medium"]
workers = 48

[[models]]
model = "google/gemini-4-argon"
provider = "google-ai-studio"

[[models]]
model = "google/gemini-4-carbon"
provider = "google-ai-studio"

[[models]]
model = "qwen/qwen4-max"
provider = "alibaba"
